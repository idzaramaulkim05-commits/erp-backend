[program:ioms-worker]
directory=/var/www/ioms/backend
command=/usr/bin/php artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=ioms
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ioms-worker.log
stopwaitsecs=3600
